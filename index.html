<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Optional: Custom Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-900 text-white min-h-screen flex items-center justify-center px-6">

  <div class="max-w-3xl text-center">
    
    <!-- Logo / Brand -->
    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-6">
      Printerradar
    </h1>

    <!-- Main Heading -->
    <h2 class="text-3xl md:text-5xl font-bold leading-tight mb-6">
      🚀 Something Amazing is Coming Soon
    </h2>

    <!-- Description -->
    <p class="text-lg md:text-xl text-gray-300 mb-10">
      We’re working hard to launch our new website. Stay tuned for something
      modern, powerful, and built just for you.
    </p>

    <!-- Email Subscription Form -->
    <form class="flex flex-col sm:flex-row gap-4 justify-center mb-10">
      <input 
        type="email" 
        placeholder="Enter your email"
        required
        class="px-5 py-3 rounded-lg text-gray-900 w-full sm:w-80 focus:outline-none focus:ring-2 focus:ring-indigo-400"
      />
      <button 
        type="submit"
        class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 transition duration-300 rounded-lg font-semibold shadow-lg"
      >
        Notify Me
      </button>
    </form>

    <!-- Countdown Timer -->
    <div id="countdown" class="grid grid-cols-2 sm:grid-cols-4 gap-6 text-center">
      <div>
        <p id="days" class="text-3xl font-bold">00</p>
        <p class="text-gray-400 text-sm">Days</p>
      </div>
      <div>
        <p id="hours" class="text-3xl font-bold">00</p>
        <p class="text-gray-400 text-sm">Hours</p>
      </div>
      <div>
        <p id="minutes" class="text-3xl font-bold">00</p>
        <p class="text-gray-400 text-sm">Minutes</p>
      </div>
      <div>
        <p id="seconds" class="text-3xl font-bold">00</p>
        <p class="text-gray-400 text-sm">Seconds</p>
      </div>
    </div>

    <!-- Footer -->
    <p class="mt-12 text-gray-500 text-sm">
      © 2026 Printerradar. All rights reserved.
    </p>

  </div>

  <!-- Countdown Script -->
  <script>
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 15);

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      document.getElementById("days").innerText = days.toString().padStart(2, '0');
      document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
      document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
      document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
